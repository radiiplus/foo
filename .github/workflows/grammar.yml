name: FOO grammar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Nim 2.2.12
        run: |
          curl -fsSL https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim-init.sh
          sh /tmp/choosenim-init.sh -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:editor
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: xvfb-run -a npm run test:host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-evidence
          path: .artifacts/editor/evidence/
