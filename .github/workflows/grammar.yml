name: Tratio grammar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/textmate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/textmate/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node tests/probe.mjs
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/textmate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/textmate/package-lock.json
      - run: npm ci --ignore-scripts
      - run: xvfb-run -a npm run test:editor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-evidence
          path: editors/textmate/.cache/evidence/
